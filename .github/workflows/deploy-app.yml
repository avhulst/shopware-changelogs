name: Build & Deploy Changelog-App (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "app/vite/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        working-directory: app/vite
        run: npm install

      - name: Build
        working-directory: app/vite
        run: npm run build

      # SPA-Fallback, damit direkte Aufrufe nicht 404 geben
      - name: 404-Fallback kopieren
        working-directory: app/vite/dist
        run: cp index.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/vite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
