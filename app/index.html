<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopware Changelog-Suche (Trassd)</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
.wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #10b981; display: inline-block; }
.sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
.search { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; margin-bottom: 12px; background: #fff; }
.search:focus { outline: 2px solid #10b981; border-color: transparent; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.pill { border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: #334155; }
.pill.active { background: #059669; color: #fff; border-color: #059669; }
.pill .date { opacity: .7; font-weight: 400; margin-left: 6px; font-size: 11px; }
.pill .count { margin-left: 6px; background: #d1fae5; color: #065f46; border-radius: 4px; padding: 0 4px; font-size: 11px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.card h2 { margin: 0; font-size: 17px; display: inline; }
.badge { display: inline-block; background: #d1fae5; color: #065f46; border-radius: 999px; font-size: 11px; padding: 2px 8px; margin-left: 8px; vertical-align: middle; }
.badge.security { background: #fee2e2; color: #991b1b; }
.meta { color: #64748b; font-size: 13px; }
.kurz { font-size: 14px; color: #475569; margin: 6px 0; }
a { color: #047857; }
.tabs { display: flex; border-bottom: 1px solid #e2e8f0; background: #fff; border-radius: 12px 12px 0 0; overflow: hidden; }
.tab { padding: 10px 16px; font-size: 14px; font-weight: 500; border: none; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: #64748b; }
.tab.active { border-color: #059669; color: #047857; background: #ecfdf5; }
.tab.activeDark { border-color: #0f172a; color: #0f172a; background: #f8fafc; }
.panel { background: #fff; border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 12px 12px; margin-bottom: 16px; }
ul.punkte { list-style: none; margin: 0; padding: 18px; }
ul.punkte li { font-size: 14px; line-height: 1.6; margin-bottom: 8px; padding-left: 16px; position: relative; }
ul.punkte li::before { content: "\2022"; color: #059669; font-weight: bold; position: absolute; left: 0; }
pre.kanal { padding: 18px; font-size: 12px; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #334155; max-height: 320px; overflow: auto; margin: 0; }
.status { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 16px; font-size: 14px; }
.error { color: #b91c1c; }
input.token { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; width: 260px; }
footer { color: #94a3b8; font-size: 12px; margin-top: 20px; }
.empty { color: #64748b; font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
// App v1.2: ohne Babel/JSX, reines React.createElement — laeuft direkt vom Dateisystem.
var h = React.createElement;
var REPO_OWNER = "avhulst", REPO_NAME = "shopware-changelogs", BRANCH = "main";
var PERSONAS = [
  { key: "entwickler", label: "Entwickler" },
  { key: "projektmanager", label: "Projekt-Manager" },
  { key: "vertrieb", label: "Vertrieb" }
];
var CHANNELS = [
  { key: "slack", label: "Slack" },
  { key: "teams", label: "Teams" },
  { key: "blog", label: "Blog" }
];

function fetchJson(path) {
  // raw.githubusercontent.com statt api.github.com: kein API-Rate-Limit, CORS ok, kein Token noetig.
  var url = "https://raw.githubusercontent.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + BRANCH + "/" + path;
  return fetch(url).then(function (res) {
    if (!res.ok) throw new Error("HTTP " + res.status + " (" + path + ")");
    return res.json();
  });
}

function entryHay(e, withChannels) {
  var parts = [e.version, e.kurztitel, e.type], i, c, pv, cv;
  var hf = (e.highlights || {});
  for (i = 0; i < (hf.criticalFixes || []).length; i++) {
    c = hf.criticalFixes[i]; parts.push(c.title || "", c.summary || "");
  }
  for (i = 0; i < (hf.features || []).length; i++) {
    c = hf.features[i]; parts.push(c.title || "", c.summary || "");
  }
  if (hf.core) parts.push.apply(parts, hf.core);
  for (i = 0; i < PERSONAS.length; i++) {
    pv = (e.personas || {})[PERSONAS[i].key];
    if (pv) parts.push.apply(parts, pv.punkte || pv);
  }
  if (withChannels) {
    for (i = 0; i < CHANNELS.length; i++) {
      cv = (e.channels || {})[CHANNELS[i].key];
      if (cv) parts.push(cv.titel || "", cv.text || "");
    }
  }
  return parts.join(" ").toLowerCase();
}

function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

var App = function () {
  var st = React.useState, cb = React.useCallback, memo = React.useMemo, eff = React.useEffect;
  var entries = st(null), setEntries = entries[1]; entries = entries[0];
  var error = st(null), setError = error[1]; error = error[0];
  var query = st(""), setQuery = query[1]; query = query[0];
  var persona = st("entwickler"), setPersona = persona[1]; persona = persona[0];
  var channel = st("slack"), setChannel = channel[1]; channel = channel[0];
  var selected = st(null), setSelected = selected[1]; selected = selected[0];

  var load = cb(function () {
    return fetchJson("data/index.json").then(function (idx) {
      var kurz = {};
      idx.entries.forEach(function (e) { kurz[e.version] = e.kurztitel || ""; });
      return Promise.all(idx.entries.map(function (e) { return fetchJson(e.file); }));
    }).then(function (list) {
      list.forEach(function (e) { if (!e.kurztitel && kurz[e.version]) e.kurztitel = kurz[e.version]; });
      list.sort(function (a, b) {
        if (a.releasedAt !== b.releasedAt) return a.releasedAt < b.releasedAt ? 1 : -1;
        return a.version < b.version ? 1 : -1;
      });
      setEntries(list); setError(null);
      setSelected(list.length ? list[0].version : null);
    }).catch(function (err) { setError(String(err && err.message || err)); });
  }, []);

  eff(function () { load(); }, [load]);

  var q = query.trim().toLowerCase();
  var filtered = memo(function () {
    return (entries || []).filter(function (e) { return !q || entryHay(e, true).indexOf(q) !== -1; });
  }, [entries, q]);

  var entry = memo(function () {
    if (!entries) return null;
    var i;
    for (i = 0; i < entries.length; i++) if (entries[i].version === selected) return entries[i];
    return filtered[0] || null;
  }, [entries, selected, filtered]);

  function matchCount(e) {
    if (!q) return 0;
    var m = entryHay(e, true).match(new RegExp(escapeRe(q), "gi"));
    return m ? m.length : 0;
  }

  if (error) {
    return h("div", { className: "wrap" },
      h("div", { className: "status error" },
        h("p", null, h("strong", null, "Daten konnten nicht geladen werden: "), " ", error),
        h("button", { className: "pill", onClick: load }, "Erneut versuchen")
      )
    );
  }

  if (!entries) return h("div", { className: "wrap" }, h("div", { className: "status" }, "Lade Daten aus " + REPO_OWNER + "/" + REPO_NAME + " …"));

  var pv = entry && entry.personas && entry.personas[persona];
  var punkte = pv ? (pv.punkte || pv) : [];
  var cv = entry && entry.channels && entry.channels[channel];

  return h("div", { className: "wrap" },
    h("h1", null, h("span", { className: "dot" }), "Shopware Changelog-Suche"),
    h("div", { className: "sub" }, "Trassd · " + entries.length + " Einträge · Datenbestand: " + entries.map(function (e) { return e.version; }).join(", ")),
    h("input", { className: "search", value: query, onChange: function (e) { setQuery(e.target.value); }, placeholder: "Suchen, z.B. CSP, ZUGFeRD, MCP, ProductBackInStockEvent …" }),
    h("div", { className: "pills" },
      filtered.map(function (e) {
        return h("button", {
          key: e.version,
          className: "pill" + (entry && entry.version === e.version ? " active" : ""),
          onClick: function () { setSelected(e.version); }
        }, "v" + e.version,
          h("span", { className: "date" }, e.releasedAt),
          query.trim() ? h("span", { className: "count" }, matchCount(e)) : null
        );
      }),
      filtered.length === 0 ? h("span", { className: "empty" }, "Kein Eintrag gefunden. Suchbegriff ändern.") : null
    ),
    entry ? [
      h("div", { key: "card", className: "card" },
        h("h2", null, "Shopware " + entry.version),
        h("span", { className: "badge" + (entry.type === "security" ? " security" : "") },
          entry.type === "security" ? "\uD83D\uDD12 security" : entry.type),
        h("div", { className: "meta" }, "veröffentlicht " + entry.releasedAt + " · geprüft " + entry.checkedAt),
        h("div", { className: "kurz" }, entry.kurztitel || ""),
        (entry.sources || []).map(function (s, i) {
          return h("div", { key: i, style: { fontSize: 13, marginTop: 2 } },
            h("a", { href: s.url, target: "_blank", rel: "noreferrer" }, s.name + " ↗"));
        })
      ),
      h("div", { key: "ptabs", className: "tabs" },
        PERSONAS.map(function (p) {
          return h("button", { key: p.key, className: "tab" + (persona === p.key ? " active" : ""), onClick: function () { setPersona(p.key); } }, p.label);
        })
      ),
      h("div", { key: "ppanel", className: "panel" },
        h("ul", { className: "punkte" }, punkte.map(function (pkt, i) { return h("li", { key: i }, pkt); }))
      ),
      h("div", { key: "ctabs", className: "tabs" },
        CHANNELS.map(function (c) {
          return h("button", { key: c.key, className: "tab" + (channel === c.key ? " activeDark" : ""), onClick: function () { setChannel(c.key); } }, c.label);
        })
      ),
      h("div", { key: "cpanel", className: "panel" },
        h("pre", { className: "kanal" }, cv ? cv.text : "")
      )
    ] : null,
    h("footer", null, "Quelle: github.com/" + REPO_OWNER + "/" + REPO_NAME + " (live) · Tägliche Prüfung um 08:00 (Europe/Berlin)")
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
